<text x="720" y="480" text-anchor="middle" class="sub">main(): call_llm() → parse [TOOL_CALL] → execute tool → repeat  ·  max 120 loops  ·  stall detection</text>
<text x="720" y="498" text-anchor="middle" class="lbl">Tools: read_file · write_file · bash · list_directory · create_task · requeue_self</text>
<text x="720" y="514" text-anchor="middle" class="lbl">Vision tools: launch_game · vision_query · click_element · get_game_state (TCP 11009)</text>
<text x="720" y="530" text-anchor="middle" class="lbl">Prompts: feature.yaml · bug.yaml · refactor.yaml · polish.yaml · qa.yaml · audit.yaml</text>
<text x="720" y="546" text-anchor="middle" class="lbl">Writes token counts → data/agent_&lt;task_id&gt;_tokens.json · Reads on _finish_agent()</text>

