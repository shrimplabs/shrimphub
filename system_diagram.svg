<text x="440" y="614" text-anchor="middle" class="h2">Post-task Validation  (daemon thread)</text>
<text x="440" y="633" text-anchor="middle" class="lbl">Godot: godot --headless --script check_scripts.gd  +  grep for ERROR:</text>
<text x="440" y="649" text-anchor="middle" class="lbl">Python: python -m py_compile *.py</text>
<text x="440" y="665" text-anchor="middle" class="lbl">QA agent (vision + get_game_state): every 8 completions</text>
<text x="440" y="681" text-anchor="middle" class="lbl">Failure → auto-spawn priority-100 bug task</text>

<!-- Arrow Orchestrator → Validation -->
