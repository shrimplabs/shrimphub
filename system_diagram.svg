<!-- Legend row 2 - key numbers -->
<text x="40" y="788" class="h3">Key numbers</text>
<text x="40" y="806" class="lbl">Max agents: configurable (default 3) · Agent loop limit: 120 tool calls · Wall-clock watchdog: 3600s</text>
<text x="40" y="822" class="lbl">Auto-QA trigger: every 8 Godot completions · Task priorities: 100 (refactor/bug) · 80 (bug) · 75 (QA) · 50 (feature/polish)</text>
<text x="40" y="838" class="lbl">Monitor sleep: 5s active / 30s idle · Stall detection: 3 identical consecutive tool calls → redirect prompt injected</text>
<text x="40" y="854" class="lbl">Recovery: exhausted max_attempts → recovery task spawned with full failure history; dependents reparented</text>

