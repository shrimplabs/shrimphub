<text x="950" y="614" text-anchor="middle" class="h2">Task Lifecycle  ·  swarm/tasks.py</text>
<text x="950" y="633" text-anchor="middle" class="lbl">pending → in_progress → completed | failed</text>
<text x="950" y="649" text-anchor="middle" class="lbl">On failure: attempts++ · last_failure injected into next prompt</text>
<text x="950" y="665" text-anchor="middle" class="lbl">On exhausted attempts: recovery task spawned · dependents reparented</text>
<text x="950" y="681" text-anchor="middle" class="lbl">Dependencies: DAG (cycle-detected) · self-heal when dep pruned as failed</text>

